<script>
(function () {
  "use strict";

  function init() {
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const result = document.getElementById("result"); 
    const hint   = document.getElementById("hint");

    // If these are missing, stop (but don't crash)
    if (!zone || !yesBtn || !noBtn || !result || !hint) {
      console.error("Missing one or more required elements: zone/yesBtn/noBtn/result/hint");
      return;
    }

    /* ---------- CONFETTI (SAFE) ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      if (!confettiCanvas) return;
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width  = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);

    let confettiInstance = null;
    try {
      if (confettiCanvas && window.confetti && typeof window.confetti.create === "function") {
        confettiInstance = window.confetti.create(confettiCanvas, {
          resize: false,
          useWorker: true
        });
      }
    } catch (e) {
      confettiInstance = null;
    }

    function fullScreenConfetti() {
      if (!confettiInstance) return;

      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    /* ---------- YES BUTTON GROWS ---------- */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = "translateY(-50%) scale(" + yesScale + ")";
    }

    /* ---------- NO BUTTON RUNS AWAY ---------- */
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(clientX, clientY) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - clientX;
      let dy = (b.top + b.height / 2) - clientY;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      let newLeft = (b.left - z.left) + dx * 150;
      let newTop  = (b.top - z.top) + dy * 150;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop  = clamp(newTop, 0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top  = newTop + "px";
      noBtn.style.transform = "none";

      growYes();
    }

    function handleMove(clientX, clientY) {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - clientX,
        (b.top + b.height / 2) - clientY
      );
      if (d < 140) moveNo(clientX, clientY);
    }

    zone.addEventListener("pointermove", function (e) {
      handleMove(e.clientX, e.clientY);
    });

    zone.addEventListener("mousemove", function (e) {
      handleMove(e.clientX, e.clientY);
    });

    zone.addEventListener("touchmove", function (e) {
      const t = e.touches[0];
      if (!t) return;
      handleMove(t.clientX, t.clientY);
    }, { passive: true });

    noBtn.addEventListener("click", function (e) {
      e.preventDefault();
    });

    yesBtn.addEventListener("click", function () {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  }

  // Wait until DOM is ready
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
